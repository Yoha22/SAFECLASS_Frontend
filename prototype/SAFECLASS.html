<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAFECLASS — Sistema de Vigilancia Escolar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0b0f1a; color: #e2e8f0; }
    body { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    #root { height: 100%; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f1a; }
    ::-webkit-scrollbar-thumb { background: #1e2d4a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #253d6b; }

    /* Input reset */
    input, select, button, textarea {
      font-family: 'Inter', sans-serif;
      color: inherit;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.4) sepia(1) hue-rotate(190deg);
      cursor: pointer;
    }

    /* ── Animations ─────────────────────────────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.85); }
    }
    @keyframes alertPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.7; }
    }
    @keyframes criticalPulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 12px #ef4444; }
      50%       { opacity: 0.6; box-shadow: 0 0 4px #ef4444; }
    }
    @keyframes bounce {
      0%  { transform: scale(1); }
      40% { transform: scale(1.3); }
      70% { transform: scale(0.9); }
      100%{ transform: scale(1); }
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes growUp {
      from { height: 0 !important; }
    }
    @keyframes growRight {
      from { width: 0 !important; }
    }
    @keyframes donutGrow {
      from { stroke-dasharray: 0 1000; }
    }

    /* ── Hover states ───────────────────────────────────────────────────── */
    button:not(:disabled):hover { filter: brightness(1.1); }
    button:not(:disabled):active { filter: brightness(0.95); transform: scale(0.99); }

    /* ── Focus visible ──────────────────────────────────────────────────── */
    :focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    }
    :focus:not(:focus-visible) { outline: none; }

    /* ── Tooltip ────────────────────────────────────────────────────────── */
    [title] { cursor: help; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Mock data (plain JS) -->
  <script src="mockData.js"></script>

  <!-- Shared components -->
  <script type="text/babel" src="components/shared.jsx"></script>

  <!-- Feature components -->
  <script type="text/babel" src="components/login.jsx"></script>
  <script type="text/babel" src="components/panel.jsx"></script>
  <script type="text/babel" src="components/alertDetail.jsx"></script>
  <script type="text/babel" src="components/history.jsx"></script>
  <script type="text/babel" src="components/coordinator.jsx"></script>
  <script type="text/babel" src="components/admin.jsx"></script>

  <!-- Main app -->
  <script type="text/babel" src="components/app.jsx"></script>
</body>
</html>
